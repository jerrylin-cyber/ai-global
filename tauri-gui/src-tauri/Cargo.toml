[package]
name = "tauri-gui"
version = "0.1.0"
description = "Tauri GUI for ai-global"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }
regex = "1.10"
shellexpand = "3.0"
chrono = "0.4"

[features]
default = []
