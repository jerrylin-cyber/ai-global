name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: tauri-gui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build app package
        run: npm run build

      - name: Upload build artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            tauri-gui/src-tauri/target/release/bundle/dmg/*.dmg
            tauri-gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
            tauri-gui/src-tauri/target/release/bundle/msi/*.msi
            tauri-gui/src-tauri/target/release/bundle/nsis/*.exe
            tauri-gui/src-tauri/target/release/bundle/deb/*.deb
            tauri-gui/src-tauri/target/release/bundle/appimage/*.AppImage
